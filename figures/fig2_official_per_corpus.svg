<title id="fig2-official-per-corpus-title">Official v6 safe-arm strongest AUC by corpus</title>
<desc id="fig2-official-per-corpus-desc">Official v6 strongest orientation-safe fixed-attack ROC-AUC for four corpora. Open symbols are individual checkpoints; filled symbols are three-seed means with 2000-replicate shared-held-out-document-group bootstrap 95 percent confidence intervals. The only AUC target shown is below 0.60. Wikipedia remains the most distinguishable corpus.</desc>
