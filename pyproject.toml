[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "recursive-geodesic-composition"
version = "0.1.0"
description = "Publication implementation for recursive K-ary geodesic composition of frozen text embeddings"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{name = "Mihnea-Teodor Stoica"}]
dependencies = [
  "torch==2.13.0",
  "transformers==5.14.1",
  "datasets==5.0.0",
  "numpy==2.5.1",
  "scikit-learn==1.9.0",
  "scipy==1.18.0",
  "pandas==3.0.5",
  "PyYAML==6.0.3",
  "matplotlib==3.11.1",
  "Pillow==12.3.0",
  "tensorboard>=2.14",
]

[project.urls]
Repository = "https://github.com/MihneaTeodorStoica/recursive-geodesic-composition"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
